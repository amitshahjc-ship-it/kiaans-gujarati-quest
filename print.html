<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiaan's Gujarati Quest | Printable game</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#243b36}*{box-sizing:border-box}body{margin:0;background:#e9eee8}.toolbar{max-width:920px;margin:12px auto;padding:12px 18px;background:#214a40;color:white;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar a{color:white}.toolbar .print-button{display:inline-block;border:0;border-radius:8px;padding:11px 18px;background:#ffd99a;color:#203c36;font-weight:700;cursor:pointer;text-decoration:none}.sheet{width:8.5in;min-height:11in;margin:20px auto;padding:.58in .62in;background:white;box-shadow:0 5px 28px #40544630;position:relative;page-break-after:always}.sheet:last-child{page-break-after:auto}.mast{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #244b42;padding-bottom:12px}.mast b{font-size:14px}.mast span{font-size:11px;color:#65786f}.eyebrow{margin:20px 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9c694a;font-weight:700}h1{font-size:29px;letter-spacing:-.04em;margin:5px 0 7px}h2{font-size:19px;margin:19px 0 6px}p{font-size:13px;line-height:1.45}.sub{color:#61726a;margin:3px 0 14px}.line{height:1px;background:#cbd6d0}.name-row{display:flex;gap:24px;font-size:13px;margin:16px 0 10px}.name-row span{flex:1;border-bottom:1px solid #9eb3a7;min-height:24px}.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.q{border:1px solid #cadbd0;border-radius:10px;padding:10px 12px;min-height:91px;break-inside:avoid}.q b{font-size:13px}.q small{display:block;color:#61756a;margin:4px 0;font-size:11px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-top:6px;font-size:12px}.choices span{white-space:normal}.bubble{display:inline-block;width:12px;height:12px;border:1.5px solid #45645a;border-radius:50%;vertical-align:middle;margin-right:5px}.instructions{border-left:3px solid #dfa469;padding:7px 10px;background:#fcf4e7;font-size:12px;margin:10px 0 14px}.pairbox{border:1px solid #cadbd0;border-radius:10px;padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:0 35px}.pairbox p{display:flex;align-items:center;justify-content:space-between;margin:0;min-height:41px;border-bottom:1px solid #e5ede6;font-size:13px}.pairbox p:nth-last-child(-n+2){border:0}.pairbox i{display:inline-block;width:30px;border-bottom:1px solid #9aafa2}.write-row{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;margin:5px 0 10px;font-size:13px}.write-row>div{border-bottom:1px solid #9aafa2;min-height:38px;padding-top:3px}.wordbank{padding:10px;border:1px dashed #9ab29f;border-radius:8px;font-size:12px;line-height:1.8}.foot{position:absolute;bottom:.37in;left:.62in;right:.62in;font-size:10px;color:#798981;border-top:1px solid #d5dfd7;padding-top:8px;display:flex;justify-content:space-between}.key-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px;font-size:13px;line-height:1.45}.key-grid p{margin:0;padding:5px 0;border-bottom:1px solid #e5ece5}.key-grid b{color:#244b42}.note{font-size:12px;color:#5b7065;background:#f2f6f0;padding:13px;border-radius:9px;line-height:1.55}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.card{height:82px;border:1.5px dashed #8aab98;border-radius:8px;display:grid;place-items:center;text-align:center;padding:10px;font-size:15px;font-weight:700;break-inside:avoid}.card small{font-size:11px;font-weight:400;color:#698272}.print-extras{display:none}@media(max-width:900px){.sheet{width:min(8.5in,100%);margin:12px auto;padding:32px 24px}.toolbar{margin:0;border-radius:0}.foot{left:24px;right:24px}}@media(max-width:600px){.qgrid,.key-grid{grid-template-columns:1fr}.card-grid{grid-template-columns:repeat(2,1fr)}.sheet{min-height:0;padding-bottom:70px}.foot{bottom:18px}.toolbar{font-size:12px}}@page{size:letter;margin:.5in}@media print{html,body,main{margin:0;padding:0}body{background:white}.toolbar{display:none}.sheet{display:block;position:relative;width:auto;height:auto;min-height:9.6in;margin:0;padding:0;box-shadow:none;overflow:visible;break-inside:auto;page-break-inside:auto;break-before:auto;page-break-before:auto;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.qgrid,.key-grid{grid-template-columns:1fr 1fr}.card-grid{grid-template-columns:repeat(3,1fr)}.foot{position:absolute;display:flex;left:0;right:0;bottom:0}button{display:none}}
</style></head><body><div class="toolbar"><span>✦ Kiaan's Gujarati Quest · printable pack</span><div><a href="./">Back to games</a> &nbsp; <a class="print-button" href="https://drive.google.com/file/d/1RoGqha-FG21DW2GLYvZslNWpG9IBpmnW/view?usp=drivesdk&amp;authuser=amitshahjc%40gmail.com">Print four-page PDF</a></div></div><main id="pack"></main><script src="content.js"></script><script>
const D=window.WORKBOOK,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const wrap=(section,title,intro,body,n)=>`<section class="sheet"><div class="mast"><b>ક &nbsp; Kiaan's Gujarati Quest</b><span>${section}</span></div><div class="eyebrow">${section}</div><h1>${title}</h1><p class="sub">${intro}</p>${body}<div class="foot"><span>Made with love for Kiaan ♡ · From your Gujarati practice workbook</span><span>${n} / 4</span></div></section>`;
const phrases=[D.phrases[0],D.phrases.find(x=>x.gu.startsWith('Sunny Haran')),D.phrases.find(x=>x.gu.startsWith('Tobey')),D.phrases.find(x=>x.gu==='Mare khavu chhe'),D.phrases.find(x=>x.gu==='Mane Oongh aave chhe'),D.phrases.find(x=>x.gu==='Hu bahar jau chhu')];const options=[['What is your name?','I am fine','Where is my car?','I want to eat'],['Sunny is running behind Deer','Sunny is sniffing','Tobey is listening','Dog is barking'],['Tobey is listening','Tobey is running','My dog is Sunny','Come again'],['I want to eat','I am full','I am hungry','I want water'],['I am feeling sleepy','I am fine','I am tired','Enough'],['I am going out','I am going to play','I am full','I am hungry']];let mc=phrases.map((x,i)=>`<div class="q"><b>${i+1}. ${esc(x.gu)}</b><small>What does it mean? Circle one.</small><div class="choices">${options[i].map((a,j)=>`<span><i class="bubble"></i>${'ABCD'[j]}. ${esc(a)}</span>`).join('')}</div></div>`).join('');let page1=wrap('01 / QUIZ','The phrase detective','Six real phrases from the workbook. Circle the English meaning.','<div class="name-row">Name <span></span> Date <span></span></div><div class="qgrid">'+mc+'</div><p class="instructions"><b>Bonus:</b> Which phrase talks about Tobey? Underline the word for “listening.”</p>',1);
let left=[['A','Kaka'],['B','Masi'],['C','Hath'],['D','Haran'],['E','Ravi vaar'],['F','Kusum']],right=[['1','Hand'],['2','Flower'],['3','Sunday'],['4','Deer'],['5',"Father's brother"],['6',"Mother's sister"]];let pairs='<div class="pairbox">'+left.map((x,i)=>`<p>${x[0]}. ${x[1]} <i></i></p><p>${right[i][0]}. ${right[i][1]} <i></i></p>`).join('')+'</div>';let colors=D.colors.filter(x=>['Green','Blue','Black'].includes(x.en));let questions=colors.map((x,i)=>`<div class="write-row"><b>${i+1}.</b><div>${x.en}, ${['female','neutral','male'][i]} form: ______________________________</div></div>`).join('');let page2=wrap('02 / MATCH + COLORS','Connect the clues','Write the matching number by each letter. Then switch the color forms.',`<p class="instructions">Write the matching number on the line beside each Gujarati word.</p>${pairs}<h2>Color switch</h2><p class="sub">The workbook changes some colors for male, female and neutral forms.</p>${questions}<div class="wordbank"><b>Word bank:</b> ${[...new Set(colors.flatMap(x=>[x.male,x.female,x.neutral]))].join(' · ')}</div>`,2);
let v=D.verbs.filter(x=>['Run','Eat','Go','Drink'].includes(x.en));let tense=v.map((x,i)=>`<div class="write-row"><b>${i+1}.</b><div>${x.en} · ${['future','past','present','future'][i]}: ______________________________</div></div>`).join('');let nums=D.numbers.slice(0,8);let numberQuestions=[['૩','Three'],['૭','Seven'],['૧','One']];let page3=wrap('03 / TIME TRAVEL','Words across time','Find the exact form from the workbook verb table. Roman spelling is fine.',`<div class="name-row">Name <span></span> Date <span></span></div>${tense}<div class="wordbank"><b>Verb bank:</b> ${v.flatMap(x=>[x.past,x.present,x.future]).join(' · ')}</div><h2>Number code</h2><p class="sub">Write the English number next to each Gujarati numeral.</p>${numberQuestions.map((x,i)=>`<div class="write-row"><b>${i+5}.</b><div>${x[0]} = ______________________________</div></div>`).join('')}<p class="instructions"><b>Extra challenge:</b> Make your own sentence with Sunny or Tobey using a word on this page.</p>`,3);
let answers=`<div class="key-grid"><div><h2>Phrase detective</h2>${phrases.map((x,i)=>`<p><b>${i+1}.</b> ${'ABCD'[options[i].indexOf(x.en)]} · ${esc(x.en)}</p>`).join('')}</div><div><h2>Connect + color switch</h2><p>A → 5 · B → 6 · C → 1</p><p>D → 4 · E → 3 · F → 2</p>${colors.map((x,i)=>`<p><b>${i+1}.</b> ${x.en}, ${['female','neutral','male'][i]}: ${esc(x[['female','neutral','male'][i]])}</p>`).join('')}</div><div><h2>Time travel</h2>${v.map((x,i)=>`<p><b>${i+1}.</b> ${x.en}: ${esc(x[['future','past','present','future'][i]])}</p>`).join('')}<p><b>5–7.</b> Three · Seven · One</p></div></div><p class="note">The workbook uses Romanized spellings and includes some unusual variants. This answer key follows the source, not a standardized spelling guide. Give credit for a close phonetic answer when discussing it together.</p><h2>Cut-out challenge cards</h2><p class="sub">Cut along the dashed lines. Flip a card and say its meaning without peeking at the answer key.</p><div class="card-grid">${[...phrases.slice(0,3),...D.animals.slice(-3)].map(x=>`<div class="card">${esc(x.gu)}<small>What does it mean?</small></div>`).join('')}</div>`;let page4=wrap('04 / ANSWERS + CARDS','Check your thinking','Answer key and six mini challenge cards to cut out.',answers,4);document.querySelector('#pack').innerHTML=page1+page2+page3+page4;
</script></body></html>
